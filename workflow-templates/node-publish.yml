name: Publish

on:
  push:
    branches: [$default-branch]

permissions:
  contents: read
  packages: write

jobs:
  # hub-stage: publish
  publish:
    uses: ExperienceQuality/.github/.github/workflows/node-publish.yml@v1
    with:
      node-version: "24"
      package-manager: npm
      package-directories: .
