name: Reusable Node.js test

# hub-stage: test
on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version
        required: false
        type: string
        default: "24"
      package-manager:
        description: npm or pnpm
        required: true
        type: string
      working-directory:
        description: Directory where ci:test runs, relative to the repository root (install always runs at the root)
        required: false
        type: string
        default: "."

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
      - name: Install (frozen lockfile)
        env:
          PM: ${{ inputs.package-manager }}
        run: |
          case "$PM" in
            pnpm) pnpm install --frozen-lockfile ;;
            npm)  npm ci ;;
            *)    echo "::error::package-manager must be npm or pnpm, got '$PM'"; exit 1 ;;
          esac
      - name: Run ci:test
        working-directory: ${{ inputs.working-directory }}
        env:
          PM: ${{ inputs.package-manager }}
        run: $PM run ci:test
