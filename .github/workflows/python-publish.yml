name: Reusable Python publish

# hub-stage: publish
# Builds release assets via ci-publish (must write files under dist/), then creates a
# GitHub Release for the pyproject version unless the project is private or that
# release tag already exists. Callers: push to the default branch only, gate with
# `needs: [build, test]`, grant contents: write. Monorepos: call once per package
# with a matrix over working-directory and a distinct tag-prefix when versions collide.
on:
  workflow_call:
    inputs:
      python-version:
        description: Python version
        required: false
        type: string
        default: "3.12"
      working-directory:
        description: Directory of the package to publish, relative to the repository root (uv sync always runs at the root)
        required: false
        type: string
        default: "."
      tag-prefix:
        description: Prefix before vVERSION for the GitHub Release tag (e.g. "my-lib-" → my-lib-v1.2.3). Empty → vVERSION
        required: false
        type: string
        default: ""
    outputs:
      published:
        description: '"true" if a GitHub Release was created'
        value: ${{ jobs.publish.outputs.published }}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true
      - name: Install (frozen lockfile)
        run: uv sync --frozen
      - name: Publish if new
        id: publish
        working-directory: ${{ inputs.working-directory }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          PYTHON_VERSION: ${{ inputs.python-version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          meta=$(uv run --python "$PYTHON_VERSION" --no-project python -c '
          import sys
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_bytes())
          project = data["project"]
          if "version" not in project:
              sys.stderr.write("pyproject.toml must set static project.version (dynamic versions unsupported)\n")
              sys.exit(1)
          classifiers = project.get("classifiers") or []
          private = "Private :: Do Not Upload" in classifiers
          print(project["name"])
          print(project["version"])
          print("true" if private else "false")
          ')
          name=$(printf '%s\n' "$meta" | sed -n '1p')
          version=$(printf '%s\n' "$meta" | sed -n '2p')
          private=$(printf '%s\n' "$meta" | sed -n '3p')
          tag="${TAG_PREFIX}v${version}"

          if [ "$private" = "true" ]; then
            echo "$name is private (Private :: Do Not Upload); skipping."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          uv run --frozen ci-publish

          shopt -s nullglob
          assets=(dist/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::ci-publish produced no files under dist/"
            exit 1
          fi

          gh release create "$tag" \
            --title "${name} ${version}" \
            --notes "Release ${name} ${version}." \
            --target "$TARGET_SHA" \
            "${assets[@]}"

          echo "published=true" >> "$GITHUB_OUTPUT"
