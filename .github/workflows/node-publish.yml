name: Reusable Node.js publish

# hub-stage: publish
on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version
        required: false
        type: string
        default: "24"
      package-manager:
        description: Package manager (npm or pnpm)
        required: true
        type: string
      working-directory:
        description: Directory for optional ci:build prepare, relative to repository root
        required: false
        type: string
        default: "."
      package-directories:
        description: Newline or comma-separated package directories relative to repository root
        required: false
        type: string
        default: "."
      package-names:
        description: Optional newline or comma-separated names that must match each directory
        required: false
        type: string
        default: ""
      prepare:
        description: Run ci:build before packing (ci:build or none)
        required: false
        type: string
        default: ci:build
      dry-run:
        description: Pack and verify without publishing
        required: false
        type: boolean
        default: false
      ref:
        description: Git ref or SHA to check out (empty uses the caller SHA)
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out caller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          path: source
          ref: ${{ inputs.ref }}
      - name: Check out workflow implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: workflow-source
      - name: Set up Node.js for GitHub Packages
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://npm.pkg.github.com
          scope: "@experiencequality"
      - name: Publish packages newer than GitHub Packages
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/node-publish
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PACKAGE_MANAGER: ${{ inputs.package-manager }}
          INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
          INPUT_PACKAGE_DIRECTORIES: ${{ inputs.package-directories }}
          INPUT_PACKAGE_NAMES: ${{ inputs.package-names }}
          INPUT_PREPARE: ${{ inputs.prepare }}
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
        run: |
          mkdir -p "$ARTIFACT_DIRECTORY"
          node workflow-source/scripts/node-runner.mjs publish \
            --workspace "$GITHUB_WORKSPACE/source" \
            --package-manager "$INPUT_PACKAGE_MANAGER" \
            --working-directory "$INPUT_WORKING_DIRECTORY" \
            --package-directories "$INPUT_PACKAGE_DIRECTORIES" \
            --package-names "$INPUT_PACKAGE_NAMES" \
            --prepare "$INPUT_PREPARE" \
            --dry-run "$INPUT_DRY_RUN" \
            --github-repository "$GITHUB_REPOSITORY" \
            --artifact-directory "$ARTIFACT_DIRECTORY"
      - name: Upload published package artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-node-package
          path: ${{ runner.temp }}/node-publish/*.tgz
          if-no-files-found: ignore
