name: Reusable Node.js publish

# hub-stage: publish
# Publishes the one package in working-directory to GitHub Packages, unless it is private
# or its version is already published. Callers: push to the default branch only,
# gate with `needs: [build, test]`, grant contents: read + packages: write.
# Monorepos: call once per package with a matrix over working-directory.
on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version
        required: false
        type: string
        default: "24"
      package-manager:
        description: npm or pnpm
        required: true
        type: string
      working-directory:
        description: Directory of the package to publish, relative to the repository root (install always runs at the root)
        required: false
        type: string
        default: "."
    outputs:
      published:
        description: '"true" if the package was published'
        value: ${{ jobs.publish.outputs.published }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://npm.pkg.github.com
          scope: "@experiencequality"
          cache: ${{ inputs.package-manager }}
      - name: Install (frozen lockfile)
        env:
          PM: ${{ inputs.package-manager }}
        run: |
          case "$PM" in
            pnpm) pnpm install --frozen-lockfile ;;
            npm)  npm ci ;;
            *)    echo "::error::package-manager must be npm or pnpm, got '$PM'"; exit 1 ;;
          esac
      - name: Publish if new
        id: publish
        working-directory: ${{ inputs.working-directory }}
        env:
          PM: ${{ inputs.package-manager }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$(node -p "require('./package.json').private === true")" = "true" ]; then
            echo "$name is private; skipping."
            echo "published=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published; skipping."
            echo "published=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          $PM run ci:publish
          echo "published=true" >> "$GITHUB_OUTPUT"
