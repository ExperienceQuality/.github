name: Reusable Python build

# hub-stage: build
on:
  workflow_call:
    inputs:
      python-version:
        description: Python version
        required: false
        type: string
        default: "3.12"
      working-directory:
        description: Directory where ci-build runs, relative to the repository root (uv sync always runs at the root)
        required: false
        type: string
        default: "."

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true
      - name: Install (frozen lockfile)
        run: uv sync --frozen
      - name: Run ci-build
        working-directory: ${{ inputs.working-directory }}
        run: uv run --frozen ci-build
